name: Update LiaScript README from course page

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: "Course page URL. Leave empty to detect a URL from README.md."
        required: false
        default: ""

  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Update LiaScript README from course page
        env:
          COURSE_URL: ${{ github.event.inputs.course_url }}
        run: |
          set -euo pipefail

          if [ -n "${COURSE_URL:-}" ]; then
            python scripts/update_readme_from_jsonld.py \
              --url "$COURSE_URL" \
              --readme README.md \
              --debug-html fetched-course-page.html
          else
            python scripts/update_readme_from_jsonld.py \
              --readme README.md \
              --debug-html fetched-course-page.html
          fi

      - name: Upload fetched HTML for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-course-page
          path: fetched-course-page.html
          if-no-files-found: ignore

      - name: Show README changes
        run: |
          git diff -- README.md

      - name: Detect README changes
        id: detect_changes
        run: |
          if git diff --quiet -- README.md; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request for README changes
        if: steps.detect_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "Update LiaScript README metadata from course page"
          title: "Update LiaScript README metadata from course page"
          body: |
            This PR updates `README.md` using metadata fetched from the configured course page.

            - Source: `scripts/update_readme_from_jsonld.py`
            - Trigger: `${{ github.workflow }}`
          base: main
          branch: chore/update-readme-from-jsonld-${{ github.run_id }}
          delete-branch: true
          add-paths: README.md
          labels: automation
