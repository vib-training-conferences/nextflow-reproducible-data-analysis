name: Update README from course JSON-LD

on:
  workflow_dispatch:
    inputs:
      course_url:
        description: "Course URL containing JSON-LD metadata"
        required: false
        default: "https://training.vib.be/all-trainings/nextflow-reproducible-and-automated-data-analysis-7"
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    paths:
      - "README.md"
      - "README-example.md"
      - "scripts/update_readme_from_jsonld.py"
      - ".github/workflows/update-readme-from-jsonld.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README from JSON-LD
        run: |
          python scripts/update_readme_from_jsonld.py \
            --url "${{ github.event.inputs.course_url }}" \
            --readme README.md \
            --marker-mode append

      - name: Show changes
        run: git diff -- README.md

      - name: Create pull request if README changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update README metadata from course JSON-LD"
          title: "Update README metadata from course JSON-LD"
          body: |
            This automated PR updates course metadata in README.md from the JSON-LD object embedded in the configured course page.
          branch: "automation/update-readme-jsonld"
          delete-branch: true
