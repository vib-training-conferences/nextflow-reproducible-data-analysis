name: Update README from HTML JSON-LD

on:
  workflow_dispatch:
    inputs:
      course_url:
        required: true
        description: Course page URL

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README
        run: |
          python scripts/update_readme_from_jsonld.py             --url "${{ github.event.inputs.course_url }}"             --readme README.md
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update README from JSON-LD
          title: Update README from JSON-LD
